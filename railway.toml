[build]
builder = "NIXPACKS"
# Install phase (nixpacks.toml) already ran npm install — do not rm node_modules
# (EBUSY on Railway's node_modules/.cache mount).
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "sh scripts/boot.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
